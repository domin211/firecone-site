<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firecone Hosting — Relaunching 22.11.2026</title>
  <meta name="description" content="Free Minecraft hosting. Firecone is back on 22 November 2026.">
  <link rel="canonical" href="https://firecone.eu/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Firecone Hosting">
  <meta property="og:title" content="Firecone Hosting — Back on 22.11.2026">
  <meta property="og:description" content="Free Minecraft hosting. Firecone is back on 22 November 2026.">
  <meta property="og:url" content="https://firecone.eu/">
  <meta property="og:image" content="https://firecone.eu/icons/favicon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon-180.png">
  <link rel="icon" href="/favicon.png" sizes="any">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0806">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  
  <main>
    <img class="logo" src="/icons/favicon-128.png" alt="Firecone" width="84" height="84">
    <p class="eyebrow">Firecone Hosting</p>
    <h1>Back on <span>22.11.2026</span></h1>
    <p class="sub">Free Minecraft hosting, rebuilt.</p>

    <div class="timer" id="timer" role="timer" aria-label="Time until launch">
      <div><b id="d">00</b><span>days</span></div>
      <div><b id="h">00</b><span>hours</span></div>
      <div><b id="m">00</b><span>minutes</span></div>
      <div><b id="s">00</b><span>seconds</span></div>
    </div>
    <p class="live" id="live" hidden>We're live.</p>

    <div class="actions">
      <a class="btn primary" href="https://discord.gg/MTkJdxNkSH">Join Discord</a>
      <a class="btn" href="https://panel.firecone.eu/">Panel</a>
    </div>
  </main>
  <footer>
    <a href="https://status.firecone.eu/">Status</a>
    <a href="mailto:firecone.eu@gmail.com">Contact</a>
  </footer>
  <script>
    // 22 Nov 2026, 00:00 Prague time (CET, UTC+1)
    var target = Date.parse('2026-11-22T00:00:00+01:00');
    var el = {d: d, h: h, m: m, s: s};
    function pad(n){ return String(n).padStart(2, '0'); }
    function tick(){
      var t = Math.max(0, target - Date.now());
      var sec = Math.floor(t / 1000);
      el.d.textContent = pad(Math.floor(sec / 86400));
      el.h.textContent = pad(Math.floor(sec % 86400 / 3600));
      el.m.textContent = pad(Math.floor(sec % 3600 / 60));
      el.s.textContent = pad(sec % 60);
      if (t === 0) { timer.hidden = true; live.hidden = false; }
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
