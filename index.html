<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firecone — 22.11.2026</title>
  <meta name="description" content="Free Minecraft hosting is coming back on 22.11.2026.">
  <link rel="canonical" href="https://firecone.eu/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Firecone Hosting">
  <meta property="og:title" content="Firecone Hosting — 22.11.2026">
  <meta property="og:description" content="Free Minecraft hosting is coming back on 22.11.2026.">
  <meta property="og:url" content="https://firecone.eu/">
  <meta property="og:image" content="https://firecone.eu/icons/favicon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon-180.png">
  <link rel="icon" href="/favicon.png" sizes="any">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#17110d">
  <link rel="preload" href="/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="embers" id="embers" aria-hidden="true"></div>
  <main>
    <img class="logo" src="/icons/favicon-128.png" alt="Firecone" width="72" height="72">
    <h1 class="name">FIRECONE</h1>
    <p class="date">22.11.2026</p>
    <p class="sub">Free Minecraft hosting is coming back.</p>

    <div class="timer" id="timer" role="timer" aria-label="Time until launch">
      <div><b id="d">00</b><span>days</span></div>
      <div><b id="h">00</b><span>hours</span></div>
      <div><b id="m">00</b><span>min</span></div>
      <div><b id="s">00</b><span>sec</span></div>
    </div>
    <p class="live" id="live" hidden>WE ARE LIVE</p>

    <div class="actions">
      <a class="btn primary" href="https://discord.gg/MTkJdxNkSH">Join Discord</a>
      <a class="btn" href="https://panel.firecone.eu/">Panel</a>
    </div>
  </main>
  <footer>
    <a href="https://status.firecone.eu/">Status</a>
    <a href="mailto:firecone.eu@gmail.com">Contact</a>
  </footer>
  <script>
    // 22 Nov 2026, 00:00 Prague time (CET, UTC+1)
    var target = Date.parse('2026-11-22T00:00:00+01:00');
    var el = {d: d, h: h, m: m, s: s};
    function pad(n){ return String(n).padStart(2, '0'); }
    function tick(){
      var t = Math.max(0, target - Date.now());
      var sec = Math.floor(t / 1000);
      el.d.textContent = pad(Math.floor(sec / 86400));
      el.h.textContent = pad(Math.floor(sec % 86400 / 3600));
      el.m.textContent = pad(Math.floor(sec % 3600 / 60));
      el.s.textContent = pad(sec % 60);
      if (t === 0) { timer.hidden = true; live.hidden = false; }
    }
    tick(); setInterval(tick, 1000);

    // rising pixel embers
    (function(){
      var box = document.getElementById('embers');
      for (var i = 0; i < 28; i++) {
        var e = document.createElement('i');
        var size = [4, 6, 8][Math.floor(Math.random() * 3)];
        e.style.cssText = 'left:' + Math.random() * 100 + '%;width:' + size + 'px;height:' + size + 'px;' +
          'animation-duration:' + (7 + Math.random() * 9) + 's;animation-delay:-' + Math.random() * 16 + 's;' +
          'background:' + ['#f97316', '#fb923c', '#ea580c', '#fdba74'][Math.floor(Math.random() * 4)];
        box.appendChild(e);
      }
    })();
  </script>
</body>
</html>
